name: Dossiê do Ativo (SAP sob demanda)

# Disparado pelo app quando alguém pede o dossiê de um ativo.
on:
  workflow_dispatch:
    inputs:
      ativo:
        description: "Nº ARMAC do ativo (ex.: CM00585)"
        required: true
      job_id:
        description: "ID do pedido na fila do app"
        required: true

concurrency:
  group: dossie-ativo-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  dossie:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install psycopg2-binary==2.9.9

      - name: Run sync_dossie_ativo.py
        env:
          HANA_DB_HOST: ${{ secrets.HANA_DB_HOST }}
          HANA_DB_PORT: ${{ secrets.HANA_DB_PORT }}
          HANA_DB_USER: ${{ secrets.HANA_DB_USER }}
          HANA_DB_PASSWORD: ${{ secrets.HANA_DB_PASSWORD }}
          HANA_DB_NAME: ${{ secrets.HANA_DB_NAME }}
          SYNC_WEBHOOK_SECRET: ${{ secrets.SYNC_WEBHOOK_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          DOSSIE_ATIVO: ${{ inputs.ativo }}
          DOSSIE_JOB_ID: ${{ inputs.job_id }}
        run: python sync_dossie_ativo.py

      - name: Notificar falha ao app
        if: failure()
        env:
          SYNC_WEBHOOK_SECRET: ${{ secrets.SYNC_WEBHOOK_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          BASE="${APP_BASE_URL:-https://gestaofilialbh.lovable.app}"
          curl -sS -X POST "${BASE%/}/api/public/hooks/dossie-ativo-data" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $SYNC_WEBHOOK_SECRET" \
            -d "{\"job_id\":\"${{ inputs.job_id }}\",\"ativo\":\"${{ inputs.ativo }}\",\"error\":\"Workflow GitHub Actions falhou (run ${GITHUB_RUN_ID})\"}" || true

name: Sync Compras RC→PC (SAP)

# Extrai o fluxo de compras RC -> PC do SAP e envia ao webhook do app.
# Roda de hora em hora (mais estável que o Worker, que estoura tempo/conexão).
# Além do cron, o pg_cron do app dispara este workflow a cada 10 min
# (cron-dispatch -> workflow_dispatch).
#
# Secrets: HANA_DB_HOST/PORT/USER/PASSWORD/NAME (ou SAP_DB_*),
#          SYNC_WEBHOOK_SECRET, APP_BASE_URL (opcional)
#
# Janela de leitura (COMPRAS_JANELA, abaixo): o custo de cada consulta é quase
# todo fixo (varreduras completas de EBAN/EKPO), independente de a fatia ter 14
# ou 180 dias. Por isso fatias MAIORES = menos consultas = run mais curto.
#   14 dias -> 13 consultas por run (~17 min em 02/10)
#   60 dias ->  3 consultas por run
# Se uma fatia de 60 dias passar a ser cancelada direto pela réplica
# ("conflict with recovery" 4x seguidas na mesma fatia), volte para "30".

on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      dias:
        description: "Janela total em dias (padrão 180)"
        required: false
        default: "180"

concurrency:
  group: sync-compras-rcpc
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install psycopg2-binary==2.9.9

      - name: Run sync_compras_rcpc.py
        env:
          HANA_DB_HOST: ${{ secrets.HANA_DB_HOST }}
          HANA_DB_PORT: ${{ secrets.HANA_DB_PORT }}
          HANA_DB_USER: ${{ secrets.HANA_DB_USER }}
          HANA_DB_PASSWORD: ${{ secrets.HANA_DB_PASSWORD }}
          HANA_DB_NAME: ${{ secrets.HANA_DB_NAME }}
          SAP_DB_HOST: ${{ secrets.SAP_DB_HOST }}
          SAP_DB_PORT: ${{ secrets.SAP_DB_PORT }}
          SAP_DB_USER: ${{ secrets.SAP_DB_USER }}
          SAP_DB_PASSWORD: ${{ secrets.SAP_DB_PASSWORD }}
          SAP_DB_NAME: ${{ secrets.SAP_DB_NAME }}
          SYNC_WEBHOOK_SECRET: ${{ secrets.SYNC_WEBHOOK_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          COMPRAS_DIAS: ${{ github.event.inputs.dias }}
          # Fatias de 60 dias (3 consultas por run). Ver nota no topo do arquivo.
          COMPRAS_JANELA: "60"
        run: python -u sync_compras_rcpc.py

      # failure() cobre erro do script; cancelled() cobre o GitHub matando o job
      # por timeout-minutes — sem isso a morte por timeout não aparece no painel.
      - name: Notificar falha ao app
        if: failure() || cancelled()
        env:
          SYNC_WEBHOOK_SECRET: ${{ secrets.SYNC_WEBHOOK_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          MOTIVO: ${{ job.status == 'cancelled' && 'cancelado/timeout' || 'falhou' }}
        run: |
          BASE="${APP_BASE_URL:-https://gestaofilialbh.lovable.app}"
          curl -sS -X POST "${BASE%/}/api/public/hooks/sync-compras-rcpc" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $SYNC_WEBHOOK_SECRET" \
            -d "{\"error\":\"Workflow GitHub Actions ${MOTIVO} (run ${GITHUB_RUN_ID})\"}" || true

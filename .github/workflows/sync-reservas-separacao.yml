name: Sync Reservas de Separação (SAP EWM)

# Roda o sync_reservas_separacao.py a cada 30 min.
# Lê SAP (Postgres réplica HANA) e posta o JSON para o webhook do app.
#
# Secrets já compartilhados com sync-patio.yml:
#   HANA_DB_HOST, HANA_DB_PORT, HANA_DB_USER, HANA_DB_PASSWORD, HANA_DB_NAME
#   SYNC_WEBHOOK_SECRET
#   APP_BASE_URL         (opcional, default: https://gestaofilialbh.lovable.app)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: sync-reservas-separacao
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install psycopg2-binary==2.9.9

      - name: Run sync_reservas_separacao.py
        env:
          HANA_DB_HOST: ${{ secrets.HANA_DB_HOST }}
          HANA_DB_PORT: ${{ secrets.HANA_DB_PORT }}
          HANA_DB_USER: ${{ secrets.HANA_DB_USER }}
          HANA_DB_PASSWORD: ${{ secrets.HANA_DB_PASSWORD }}
          HANA_DB_NAME: ${{ secrets.HANA_DB_NAME }}
          SYNC_WEBHOOK_SECRET: ${{ secrets.SYNC_WEBHOOK_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: python sync_reservas_separacao.py

      # Se qualquer passo falhar (setup, secrets, timeout), avisa o app para o
      # painel não ficar preso em "carregando/running".
      - name: Notificar falha ao app
        if: failure()
        env:
          SYNC_WEBHOOK_SECRET: ${{ secrets.SYNC_WEBHOOK_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          BASE="${APP_BASE_URL:-https://gestaofilialbh.lovable.app}"
          curl -sS -X POST "${BASE%/}/api/public/hooks/sync-reservas-separacao" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $SYNC_WEBHOOK_SECRET" \
            -d "{\"error\":\"Workflow GitHub Actions falhou (run ${GITHUB_RUN_ID})\"}" || true


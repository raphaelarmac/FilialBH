name: Sync Suprimentos das OS (SAP)

# Peças pedidas por ordem de serviço (itens de compra e reserva de cada OS de
# Oficina/Preparação). Alimenta a tela de suprimentos dentro de cada OS.
#
# Separado do sync-patio.yml: esta é a leitura mais pesada e mais sensível à
# carga da réplica do SAP. Aqui ela tem agenda, limite e retry próprios, e uma
# falha dela não trava nem pinta de vermelho o sync do pátio.
#
# Roda de hora em hora no minuto 45 (fora do pico dos outros robôs: pátio e
# reservas no :00, estoque no :20, reservas no :30, compras no :35).
#
# Secrets (os mesmos do sync-patio.yml):
#   HANA_DB_HOST, HANA_DB_PORT, HANA_DB_USER, HANA_DB_PASSWORD, HANA_DB_NAME
#   SYNC_WEBHOOK_SECRET
#   APP_BASE_URL         (opcional, default: https://gestaofilialbh.lovable.app)

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch: {}

concurrency:
  group: sync-os-suprimentos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install psycopg2-binary==2.9.9

      - name: Run sync_os_suprimentos.py
        env:
          HANA_DB_HOST: ${{ secrets.HANA_DB_HOST }}
          HANA_DB_PORT: ${{ secrets.HANA_DB_PORT }}
          HANA_DB_USER: ${{ secrets.HANA_DB_USER }}
          HANA_DB_PASSWORD: ${{ secrets.HANA_DB_PASSWORD }}
          HANA_DB_NAME: ${{ secrets.HANA_DB_NAME }}
          SYNC_WEBHOOK_SECRET: ${{ secrets.SYNC_WEBHOOK_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: python -u sync_os_suprimentos.py

      # Se qualquer passo falhar (setup, secrets, timeout), avisa o app para o
      # painel não ficar preso em "carregando/running".
      - name: Notificar falha ao app
        if: failure()
        env:
          SYNC_WEBHOOK_SECRET: ${{ secrets.SYNC_WEBHOOK_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          BASE="${APP_BASE_URL:-https://gestaofilialbh.lovable.app}"
          curl -sS -X POST "${BASE%/}/api/public/hooks/sync-suprimentos-data" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $SYNC_WEBHOOK_SECRET" \
            -d "{\"error\":\"Workflow GitHub Actions falhou (run ${GITHUB_RUN_ID})\"}" || true

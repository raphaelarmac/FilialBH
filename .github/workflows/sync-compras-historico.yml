name: Sync Histórico de Pedidos (SAP)

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      dias:
        description: "Janela total em dias (padrão 1095)"
        required: false
        default: "1095"

concurrency:
  group: sync-compras-historico
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install psycopg2-binary==2.9.9

      - name: Run sync_compras_historico.py
        env:
          HANA_DB_HOST: ${{ secrets.HANA_DB_HOST }}
          HANA_DB_PORT: ${{ secrets.HANA_DB_PORT }}
          HANA_DB_USER: ${{ secrets.HANA_DB_USER }}
          HANA_DB_PASSWORD: ${{ secrets.HANA_DB_PASSWORD }}
          HANA_DB_NAME: ${{ secrets.HANA_DB_NAME }}
          SAP_DB_HOST: ${{ secrets.SAP_DB_HOST }}
          SAP_DB_PORT: ${{ secrets.SAP_DB_PORT }}
          SAP_DB_USER: ${{ secrets.SAP_DB_USER }}
          SAP_DB_PASSWORD: ${{ secrets.SAP_DB_PASSWORD }}
          SAP_DB_NAME: ${{ secrets.SAP_DB_NAME }}
          SYNC_WEBHOOK_SECRET: ${{ secrets.SYNC_WEBHOOK_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          COMPRAS_HIST_DIAS: ${{ github.event.inputs.dias }}
        run: python -u sync_compras_historico.py

      - name: Notificar falha ao app
        if: failure()
        env:
          SYNC_WEBHOOK_SECRET: ${{ secrets.SYNC_WEBHOOK_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          curl -sS -X POST "${APP_BASE_URL:-https://gestaofilialbh.lovable.app}/api/public/hooks/sync-compras-historico" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: ${SYNC_WEBHOOK_SECRET}" \
            -d '{"error":"workflow sync-compras-historico falhou"}' || true

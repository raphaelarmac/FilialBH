name: Sync SAP Peças Histórico

# Roda 1x/dia às 06:00 UTC (03:00 BRT) — histórico de peças usadas em OS SAP desde 2024.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: sync-sap-pecas-historico
  cancel-in-progress: false

jobs:
  sync-politica-estoque:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Disparar webhook política de estoque
        env:
          SYNC_WEBHOOK_SECRET: ${{ secrets.SYNC_WEBHOOK_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          BASE="${APP_BASE_URL:-https://gestaofilialbh.lovable.app}"
          echo "POST $BASE/api/public/hooks/sync-politica-estoque"
          curl -sS -X POST "$BASE/api/public/hooks/sync-politica-estoque" \
            -H "x-webhook-secret: $SYNC_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            --fail-with-body

  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install psycopg2-binary==2.9.9

      - name: Run sync
        env:
          HANA_DB_HOST: ${{ secrets.HANA_DB_HOST }}
          HANA_DB_PORT: ${{ secrets.HANA_DB_PORT }}
          HANA_DB_USER: ${{ secrets.HANA_DB_USER }}
          HANA_DB_PASSWORD: ${{ secrets.HANA_DB_PASSWORD }}
          HANA_DB_NAME: ${{ secrets.HANA_DB_NAME }}
          SYNC_WEBHOOK_SECRET: ${{ secrets.SYNC_WEBHOOK_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: python -u sync_sap_pecas_historico.py
